name: Ironman Farming Director build
on:
  push:
    branches: [ironman-farming-director-v0.1, ironman-farming-director-v0.2, ironman-farming-director-v0.3, ironman-farming-director-v0.4, ironman-farming-director-v0.5]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build and test
        run: bash gradlew clean test build --stacktrace
