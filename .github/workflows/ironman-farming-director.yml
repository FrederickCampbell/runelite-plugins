name: Farming Helper build and v0.8 release
on:
  push:
    branches: [master, farming-helper-v0.8]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build and test
        run: bash gradlew clean test build --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: farming-helper-jar
          path: build/libs/*.jar
          if-no-files-found: error
  release:
    needs: java
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: farming-helper-v0.8-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: farming-helper-jar
          path: release-artifacts
      - name: Publish the verified v0.8 beta
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag=v0.8.0-beta.1
          if ! grep -qx 'version=0.8.0-beta.1' runelite-plugin.properties; then
            echo "Different version; this one-time release is not applicable."
            exit 0
          fi
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            if [ "$(git rev-list -n 1 "$tag")" != "$GITHUB_SHA" ]; then
              echo "Release tag already points to an earlier commit; not changing it."
              exit 0
            fi
          else
            git tag "$tag" "$GITHUB_SHA"
            git push origin "refs/tags/$tag"
          fi
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" release-artifacts/*.jar --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease --title "Farming Helper v0.8 beta" --notes-file RELEASE_NOTES.md
          fi
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,isPrerelease,url
          echo "published=true" >> "$GITHUB_OUTPUT"
      - name: Prune merged v0.8 development branch
        if: steps.publish.outputs.published == 'true'
        shell: bash
        run: |
          set -euo pipefail
          branch=farming-helper-v0.8
          actual=$(git ls-remote --heads origin "refs/heads/$branch" | cut -f1)
          if [ "$actual" = "$GITHUB_SHA" ]; then
            git push --force-with-lease="refs/heads/$branch:$actual" origin ":refs/heads/$branch"
          else
            echo "Preserving branch: absent or tip differs from released commit"
          fi
