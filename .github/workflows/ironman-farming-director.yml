name: Farming Helper build and regression tests
on:
  push:
    branches: [master, farming-helper-v1.13.3-stable-transport, farming-helper-v1.13.2-transport, farming-helper-v1.13.1-stabilization, farming-helper-v1.13-consolidation, farming-helper-v1.12-workflow, farming-helper-v1.07-stabilization, farming-helper-v1.08-refactor, farming-helper-v1.09-workflow, farming-helper-v1.10-adaptive-planning, farming-helper-v1.11-consolidation, farming-helper-v1.11.2-validation, farming-helper-v1.11.3-validation, farming-helper-v1.11.4-validation, farming-helper-v1.11.5-validation]
  pull_request:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: farming-helper-${{ github.ref }}
  cancel-in-progress: true
jobs:
  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Inventory maintained source and reference candidates
        run: python3 tools/consolidation-audit.py
      - name: Build and test with a virtual display
        run: xvfb-run -a bash gradlew clean test build --stacktrace
      - name: Verify regression totals and every shipped class
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          from zipfile import ZipFile
          reports = [ET.parse(p).getroot() for p in Path('build/test-results/test').glob('TEST-*.xml')]
          totals = {k: sum(int(r.attrib.get(k, 0)) for r in reports) for k in ('tests', 'failures', 'errors', 'skipped')}
          print('Regression totals', totals)
          assert totals['tests'] > 0 and not any(totals[k] for k in ('failures','errors','skipped'))
          with ZipFile(next(Path('build/libs').glob('*.jar'))) as jar:
              majors = [int.from_bytes(jar.read(n)[6:8], 'big') for n in jar.namelist() if n.endswith('.class')]
          print('Plugin classes:', len(majors), 'classfile versions:', set(majors))
          assert set(majors) == {55}
          PY
      - name: Screen compiled JAR references
        run: python3 tools/audit-jar.py "$(find build/libs -name '*.jar' ! -name '*-all.jar' | head -1)"
      - name: Smoke-test local installer in isolated directory
        if: github.ref_name == 'farming-helper-v1.13.3-stable-transport' || github.ref_name == 'farming-helper-v1.13.2-transport' || github.ref_name == 'farming-helper-v1.13.1-stabilization' || github.ref_name == 'farming-helper-v1.13-consolidation' || github.ref_name == 'farming-helper-v1.12-workflow'
        shell: pwsh
        run: |
          $testHome = Join-Path $env:RUNNER_TEMP "farming-helper-install-test"
          & ./tools/Install-FarmingHelper.ps1 -RuneliteDirectory $testHome
          if (-not (Test-Path (Join-Path $testHome "sideloaded-plugins/FarmingHelper.jar"))) { throw "Installer did not copy JAR" }
      - uses: actions/upload-artifact@v4
        if: github.ref_name == 'farming-helper-v1.13.3-stable-transport' || github.ref_name == 'farming-helper-v1.13.2-transport' || github.ref_name == 'farming-helper-v1.13.1-stabilization' || github.ref_name == 'farming-helper-v1.13-consolidation' || github.ref_name == 'farming-helper-v1.12-workflow'
        with:
          name: farming-helper-local-test
          path: |
            build/libs/*.jar
            tools/Install-FarmingHelper.ps1
            docs/LOCAL-TEST.md
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: farming-helper-jar
          path: build/libs/*.jar
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: farming-helper-ui-preview
          path: build/reports/farming-helper-*.png
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regression-results
          path: build/test-results/test/
          if-no-files-found: ignore

  comparison:
    if: github.ref == 'refs/heads/farming-helper-v1.13.3-stable-transport' || github.ref == 'refs/heads/farming-helper-v1.13-consolidation' || github.ref == 'refs/heads/farming-helper-v1.12-workflow' || github.ref == 'refs/heads/farming-helper-v1.08-refactor' || github.ref == 'refs/heads/farming-helper-v1.09-workflow' || github.ref == 'refs/heads/farming-helper-v1.10-adaptive-planning' || github.ref == 'refs/heads/farming-helper-v1.11-consolidation' || github.ref == 'refs/heads/farming-helper-v1.11.2-validation' || github.ref == 'refs/heads/farming-helper-v1.11.3-validation' || github.ref == 'refs/heads/farming-helper-v1.11.4-validation' || github.ref == 'refs/heads/farming-helper-v1.11.5-validation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compare allocations, results and sidebar pixels on the same runner
        shell: bash
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE"
          baseline="$RUNNER_TEMP/farming-baseline"
          baseline_sha=84e8bdff3f6dff7113be38975fcb302cd91ed8d7
          if [[ "$GITHUB_REF_NAME" == farming-helper-v1.09-workflow ]]; then baseline_sha=27349d1781ca4be611c127f1267b5114b900fa9b; fi
          if [[ "$GITHUB_REF_NAME" == farming-helper-v1.10-adaptive-planning ]]; then baseline_sha=7c72ead2d296dc978ccf3a6bd52cba7fa1fda9bd; fi
          if [[ "$GITHUB_REF_NAME" == farming-helper-v1.11.2-validation ]]; then baseline_sha=b488266d316690a8a3a0f133459c1f1890fe1938; fi
          if [[ "$GITHUB_REF_NAME" == farming-helper-v1.11.3-validation ]]; then baseline_sha=5fbef15b87b34693ed398a595ec50fe9be62604e; fi
          if [[ "$GITHUB_REF_NAME" == farming-helper-v1.11.4-validation ]]; then baseline_sha=5acd9eb9af7d359b847cdb3caef3eda784a2c791; fi
          if [[ "$GITHUB_REF_NAME" == farming-helper-v1.11.5-validation ]]; then baseline_sha=fe4c1abcc7a019f4ee6318ce784f12e2eae057c0; fi
          if [[ "$GITHUB_REF_NAME" == farming-helper-v1.11-consolidation ]]; then baseline_sha=4f9a3ee63b5df95dd0692e59a6f308b7333d3e07; fi
          if [[ "$GITHUB_REF_NAME" == farming-helper-v1.12-workflow ]]; then baseline_sha=0ab13686110ccf3b38e685668f830f4651572196; fi
          if [[ "$GITHUB_REF_NAME" == farming-helper-v1.13-consolidation ]]; then baseline_sha=71a988e63b3794193610a71b8d50faad17a16c93; fi
          if [[ "$GITHUB_REF_NAME" == farming-helper-v1.13.3-stable-transport ]]; then baseline_sha=8cc105f341b4b7106288b403d56eccf02e9ed0ac; fi
          git fetch --no-tags --depth=1 origin "$baseline_sha"
          git worktree add --detach "$baseline" FETCH_HEAD
          # Compare layout with identical display metadata, including the version shown on Home.
          fixtures="$RUNNER_TEMP/farming-fixtures"
          mkdir -p "$fixtures/com/farminghelper"
          cp "$baseline/runelite-plugin.properties" "$fixtures/com/farminghelper/"
          for revision in baseline candidate; do
            if [[ "$revision" == baseline ]]; then cd "$baseline"; else cd "$root"; fi
            bash gradlew -I "$root/tools/refactor-classpath.gradle" refactorClasspath
            cp="$(cat build/refactor-classpath.txt)"
            out="$RUNNER_TEMP/probe-$revision"
            mkdir -p "$out"
            probe="$root/tools/RefactorProbe.java"
            if [[ "$GITHUB_REF_NAME" == farming-helper-v1.12-workflow && "$revision" == baseline ]]; then probe="$baseline/tools/RefactorProbe.java"; fi
            javac --release 11 -proc:none -cp "$cp" -d "$out" "$probe"
            java -Xms256m -Xmx256m -cp "$out:$cp" com.farminghelper.RefactorProbe | tee "$RUNNER_TEMP/$revision.txt"
            xvfb-run -a java -cp "$fixtures:$out:$cp" com.farminghelper.RefactorProbe preview
          done
          if [[ "$GITHUB_REF_NAME" != farming-helper-v1.12-workflow ]]; then java -cp "$out:$cp" com.farminghelper.RefactorProbe pixels "$baseline"; fi
          python3 - <<'PY'
          import os
          from pathlib import Path
          temp = Path(os.environ['RUNNER_TEMP'])
          def read(name):
              rows = [s.split() for s in (temp / (name + '.txt')).read_text().splitlines() if s.startswith('PROBE ')]
              return {op: (int(value), int(size)) for _, op, value, size in rows}
          base, tip = read('baseline'), read('candidate')
          workflow = os.environ.get('GITHUB_REF_NAME') == 'farming-helper-v1.12-workflow'
          if workflow:
              assert len(base) == 16 and len(tip) == 16
              print('48-patch planner fixture: baseline fitting-prefix result, bytes/op=', base.pop('prefix-search'))
              print('48-patch planner fixture: candidate full-demand slots result, bytes/op=', tip.pop('full-run-planning'))
          assert len(base) == (15 if workflow else 16) and base.keys() == tip.keys()
          for op, (result, size) in base.items():
              assert result == tip[op][0], op
              print(f'{op}: result={result}, bytes/op={size} -> {tip[op][1]}')
          def timings(name):
              rows = [s.split() for s in (temp / (name + '.txt')).read_text().splitlines() if s.startswith('TIME ')]
              return {op: int(ns) for _, op, ns in rows}
          a, b = timings('baseline'), timings('candidate')
          if workflow:
              print('48-patch planner fixture median ns/op:', a.pop('prefix-search'), '->', b.pop('full-run-planning'))
          assert a.keys() == b.keys() == base.keys()
          for op in a:
              print(f'{op}: median ns/op={a[op]} -> {b[op]}')
          PY
