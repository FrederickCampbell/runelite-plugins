name: Farming Helper build and regression tests
on:
  push:
    branches: [farming-helper-v0.16]
  pull_request:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build and test
        run: bash gradlew clean test build --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: farming-helper-jar
          path: build/libs/*.jar
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: farming-helper-ui-preview
          path: build/reports/farming-helper-preview.png
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regression-results
          path: build/test-results/test/
          if-no-files-found: ignore
