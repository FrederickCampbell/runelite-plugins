name: Farming Helper build and regression tests
on:
  push:
    branches: [master, farming-helper-v1.07-stabilization, farming-helper-v1.08-refactor]
  pull_request:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build and test with a virtual display
        run: xvfb-run -a bash gradlew clean test build --stacktrace
      - name: Verify regression totals and every shipped class
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          from zipfile import ZipFile
          reports = [ET.parse(p).getroot() for p in Path('build/test-results/test').glob('TEST-*.xml')]
          totals = {k: sum(int(r.attrib.get(k, 0)) for r in reports) for k in ('tests', 'failures', 'errors', 'skipped')}
          print('Regression totals', totals)
          assert totals['tests'] > 0 and not any(totals[k] for k in ('failures','errors','skipped'))
          with ZipFile(next(Path('build/libs').glob('*.jar'))) as jar:
              majors = [int.from_bytes(jar.read(n)[6:8], 'big') for n in jar.namelist() if n.endswith('.class')]
          print('Plugin classes:', len(majors), 'classfile versions:', set(majors))
          assert set(majors) == {55}
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: farming-helper-jar
          path: build/libs/*.jar
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: farming-helper-ui-preview
          path: build/reports/farming-helper-*.png
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regression-results
          path: build/test-results/test/
          if-no-files-found: ignore

  comparison:
    if: github.ref == 'refs/heads/farming-helper-v1.08-refactor'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compare allocations, results and sidebar pixels on the same runner
        shell: bash
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE"
          baseline="$RUNNER_TEMP/farming-baseline"
          git fetch --no-tags --depth=1 origin 84e8bdff3f6dff7113be38975fcb302cd91ed8d7
          git worktree add --detach "$baseline" FETCH_HEAD
          # Compare layout with identical display metadata, including the version shown on Home.
          fixtures="$RUNNER_TEMP/farming-fixtures"
          mkdir -p "$fixtures/com/farminghelper"
          cp "$baseline/runelite-plugin.properties" "$fixtures/com/farminghelper/"
          for revision in baseline candidate; do
            if [[ "$revision" == baseline ]]; then cd "$baseline"; else cd "$root"; fi
            bash gradlew -I "$root/tools/refactor-classpath.gradle" refactorClasspath
            cp="$(cat build/refactor-classpath.txt)"
            out="$RUNNER_TEMP/probe-$revision"
            mkdir -p "$out"
            javac --release 11 -proc:none -cp "$cp" -d "$out" "$root/tools/RefactorProbe.java"
            java -Xms256m -Xmx256m -cp "$out:$cp" com.farminghelper.RefactorProbe | tee "$RUNNER_TEMP/$revision.txt"
            xvfb-run -a java -cp "$fixtures:$out:$cp" com.farminghelper.RefactorProbe preview
          done
          python3 - <<'PY'
          import os
          from pathlib import Path
          from PIL import Image, ImageChops
          temp = Path(os.environ['RUNNER_TEMP'])
          def read(name):
              rows = [s.split() for s in (temp / (name + '.txt')).read_text().splitlines() if s.startswith('PROBE ')]
              return {op: (int(value), int(size)) for _, op, value, size in rows}
          base, tip = read('baseline'), read('candidate')
          assert len(base) == 4 and base.keys() == tip.keys()
          for op, (result, size) in base.items():
              assert result == tip[op][0], op
              print(f'{op}: result={result}, bytes/op={size} -> {tip[op][1]}')
          originals = sorted((temp / 'farming-baseline/build/reports').glob('farming-helper-*.png'))
          assert len(originals) == 3
          for original in originals:
              a = Image.open(original).convert('RGB')
              b = Image.open(Path('build/reports') / original.name).convert('RGB')
              assert a.size == b.size
              difference = ImageChops.difference(a, b).getbbox()
              print(f'{original.name}: {a.size}, changed bounds={difference}')
              assert difference is None
          PY
