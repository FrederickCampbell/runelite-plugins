plugins {
	id 'java'
}

repositories {
	mavenLocal()
	maven {
		url = 'https://repo.runelite.net'
		content {
			includeGroupByRegex("net\\.runelite.*")
		}
	}
	mavenCentral()
}

def runeLiteVersion = 'latest.release'
def pluginMainClass = 'com.farminghelper.FarmingHelperPluginTest'

dependencies {
	compileOnly group: 'net.runelite', name:'client', version: runeLiteVersion

	compileOnly 'org.projectlombok:lombok:1.18.30'
	annotationProcessor 'org.projectlombok:lombok:1.18.30'

	testImplementation 'junit:junit:4.13.2'
	testImplementation 'org.mockito:mockito-core:5.14.2'
	testImplementation group: 'net.runelite', name:'client', version: runeLiteVersion
	testImplementation group: 'net.runelite', name:'jshell', version: runeLiteVersion
}

group = 'com.farminghelper'
version = '1.11.2'

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.release.set(11)
}

tasks.register('run', JavaExec) {
	classpath = sourceSets.test.runtimeClasspath
	mainClass = pluginMainClass

	jvmArgs "-ea"
	args "--developer-mode", "--debug"
}

tasks.register('shadowJar', Jar) {
	dependsOn configurations.testRuntimeClasspath
	manifest {
		attributes('Main-Class': pluginMainClass, 'Multi-Release': true)
	}

	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	from sourceSets.main.output
	from sourceSets.test.output
	from {
		configurations.testRuntimeClasspath.collect { file ->
			file.isDirectory() ? file : zipTree(file)
		}
	}

	exclude 'META-INF/INDEX.LIST'
	exclude 'META-INF/*.SF'
	exclude 'META-INF/*.DSA'
	exclude 'META-INF/*.RSA'
	exclude '**/module-info.class'

	group = BasePlugin.BUILD_GROUP
	archiveClassifier.set('shadow')
	archiveFileName.set("${rootProject.name}-${project.version}-all.jar")
}

// Guard both production and test Java sources against desktop/game input injection.
// Ordinary component actions in isolated Swing tests are not OS input.
tasks.register('auditInputApis') {
    inputs.files(fileTree('src') { include '**/*.java' })
    doLast {
        def forbidden = ~/\b(?:Robot|KeyboardFocusManager|DefaultKeyboardFocusManager|MouseInfo|AWTEventListener|requestFocus(?:InWindow)?|dispatchEvent|postEvent|invokeMenuAction|menuAction|mousePress|mouseRelease|mouseMove|keyPress|keyRelease)\b/
        def findings = []
        inputs.files.files.each { source ->
            source.readLines('UTF-8').eachWithIndex { line, index ->
                if (forbidden.matcher(line).find()) {
                    findings.add("${source}: ${index + 1}: ${line.trim()}")
                }
            }
        }
        if (!findings.isEmpty()) {
            throw new GradleException('Prohibited input API references:\n' + findings.join('\n'))
        }
    }
}
tasks.named('test') { dependsOn 'auditInputApis' }

// Include actionable failure details in CI and local regression logs.
tasks.named('test') { testLogging { exceptionFormat = 'full' } }

// Release gate: conservative source screening, not a substitute for Hub
// bytecode/security review or live-client acceptance.
tasks.register('auditRelease') {
    dependsOn 'auditInputApis'
    inputs.files(fileTree('src/main/java') { include '**/*.java' },
        file('runelite-plugin.properties'), file('README.md'), file('CHANGELOG.md'),
        file('src/main/resources/com/farminghelper/runelite-plugin.properties'))
    doLast {
        def metadata = new Properties()
        file('runelite-plugin.properties').withInputStream { metadata.load(it) }
        def expected = project.version.toString()
        def sidebar = new Properties()
        file('src/main/resources/com/farminghelper/runelite-plugin.properties').withInputStream { sidebar.load(it) }
        if (sidebar.getProperty('version') != expected || metadata.getProperty('version') != expected ||
            !file('README.md').getText('UTF-8').contains("Version " + expected) ||
            !file('CHANGELOG.md').getText('UTF-8').contains("## v" + expected) ||
            metadata.getProperty('plugins') != 'com.farminghelper.FarmingHelperPlugin') {
            throw new GradleException('Release metadata mismatch')
        }
        def forbidden = ~/\b(?:java\.lang\.reflect|java\.lang\.Runtime|Runtime\.getRuntime|Class\.forName|setAccessible|MethodHandles|Unsafe|ProcessBuilder|URLClassLoader|defineClass|ObjectInputStream|ObjectOutputStream|FileInputStream|FileOutputStream|RandomAccessFile|FileReader|FileWriter|java\.nio\.file|HttpURLConnection|java\.net\.http|Desktop\.(?:open|browse)|LinkBrowser\.open|Thread\.(?:sleep|interrupt)|System\.load(?:Library)?|new\s+(?:Gson|OkHttpClient)|hopToWorld|setCanSendPackets|createMenuEntry|setMenuEntries)\b/
        def inherited = ['CropState.java','FarmingHandler.java','FarmingPatch.java','FarmingRegion.java','FarmingWorld.java','PatchImplementation.java','PatchState.java'] as Set
        int maintained = 0, imported = 0, files = 0
        def findings = [], sensitive = []
        fileTree('src/main/java') { include '**/*.java' }.files.sort().each { source ->
            files++
            def lines = source.readLines('UTF-8')
            if (source.parentFile.name == 'queststate' && inherited.contains(source.name)) imported += lines.size()
            else maintained += lines.size()
            lines.eachWithIndex { line, index ->
                def location = source.name + ':' + (index+1) + ': ' + line.trim()
                if (forbidden.matcher(line).find()) findings.add(location)
                if (line =~ /\b(?:runScript|setVarcIntValue|setOnOpListener|setAction|setChildren|setRSProfileConfiguration|setConfiguration|openTag|closeBankTag)\s*\(/)
                    sensitive.add(location)
            }
        }
        println 'Release ' + expected + ': ' + files + ' production Java files, ' + maintained + ' maintained lines, ' + imported + ' inherited lines'
        println 'Review-sensitive calls (inspect manually):'
        sensitive.each { println it }
        if (!findings.isEmpty()) throw new GradleException('Prohibited production API references:\n' + findings.join('\n'))
        println 'Release metadata and production API screen passed'
    }
}
tasks.named('test') { dependsOn 'auditRelease' }
